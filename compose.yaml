name: onlyfood

services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MARIADB_DATABASE: ${DB_NAME:-onlyfood}
      MARIADB_USER: ${DB_USER:-onlyfood}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD en .env.docker}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Definir DB_ROOT_PASSWORD en .env.docker}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging:
      options: { max-size: "10m", max-file: "3" }

  database-init:
    build:
      context: .
      target: database-init
    environment:
      DATABASE_URL: mysql://${DB_USER:-onlyfood}:${DB_PASSWORD}@db:3306/${DB_NAME:-onlyfood}
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://${DB_USER:-onlyfood}:${DB_PASSWORD}@db:3306/${DB_NAME:-onlyfood}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Definir ADMIN_PASSWORD en .env.docker}
      AUTH_SALT: ${AUTH_SALT:?Definir AUTH_SALT en .env.docker}
      BASE_URL: ${BASE_URL:?Definir BASE_URL en .env.docker}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      PRINTNODE_API_KEY: ${PRINTNODE_API_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:soporte@example.com}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    volumes:
      - ./public/uploads:/app/public/uploads
    depends_on:
      db: { condition: service_healthy }
      database-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 30s
    logging:
      options: { max-size: "10m", max-file: "3" }

  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app: { condition: service_healthy }
    logging:
      options: { max-size: "10m", max-file: "3" }

volumes:
  mariadb_data:
  caddy_data:
  caddy_config:
