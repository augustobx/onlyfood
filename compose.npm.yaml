name: onlyfood

services:
  db:
    image: mariadb:11.8.9@sha256:2439dcd7d14010ecd1ff7a4e1c5abe8e208c34fe35290744deeeaac3569043c3
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-onlyfood}
      MARIADB_USER: ${DB_USER:-onlyfood}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD en .env.docker}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Definir DB_ROOT_PASSWORD en .env.docker}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    command: ["--log-bin=mysql-bin", "--binlog-format=ROW", "--expire-logs-days=7", "--server-id=1"]
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - onlyfood-internal
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  database-init:
    profiles: ["migration"]
    image: onlyfood-database-init:latest
    build:
      context: .
      target: database-migrate
    environment:
      DATABASE_URL: mysql://${DB_USER:-onlyfood}:${DB_PASSWORD}@db:3306/${DB_NAME:-onlyfood}
    depends_on:
      db: { condition: service_healthy }
    networks:
      - onlyfood-internal
    restart: "no"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  app:
    image: onlyfood-app:latest
    build:
      context: .
      target: runner
      args:
        NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:-}
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://${DB_USER:-onlyfood}:${DB_PASSWORD}@db:3306/${DB_NAME:-onlyfood}
      AUTH_SALT: ${AUTH_SALT:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-${ENCRYPTION_MASTER_KEY:-}}
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:-}
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      BASE_URL: ${BASE_URL:-}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      ALLOW_LOCAL_STORAGE: ${ALLOW_LOCAL_STORAGE:-false}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      PLATFORM_MP_ACCESS_TOKEN: ${PLATFORM_MP_ACCESS_TOKEN:-}
      PLATFORM_MP_WEBHOOK_SECRET: ${PLATFORM_MP_WEBHOOK_SECRET:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v23.0}
      PRINTNODE_API_KEY: ${PRINTNODE_API_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:soporte@example.com}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
      BUSINESS_TIME_ZONE: ${BUSINESS_TIME_ZONE:-America/Argentina/Buenos_Aires}
    networks:
      proxy:
        aliases:
          - onlyfood-app
      onlyfood-internal:
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  mariadb_data:
    name: onlyfood_mariadb_data

networks:
  proxy:
    external: true
  onlyfood-internal:
    name: onlyfood_internal
    internal: true
